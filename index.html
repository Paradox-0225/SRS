<!DOCTYPE HTML>
<HTML LANG="EN">

<HEAD>
	<META CHARSET="UTF-8">
	<META NAME="VIEWPORT" CONTENT="WIDTH=DEVICE-WIDTH, INITIAL-SCALE=1.0">
	<TITLE>Dictionary</TITLE>
	<LINK REL="STYLESHEET" HREF="Assets/CSS/Style.CSS">
</HEAD>

<BODY CLASS="FLEX">
	<MAIN CLASS="FLEX APP-CONTAINER">
		<DIV CLASS="BORDER FLEX LINE INFO-ZONE">
			<DIV ID="TEXT-PROGRESS"></DIV>
		</DIV>

		<DIV CLASS="BORDER FLEX CARD-ZONE">
			<DIV CLASS="FLEX WORD-BOX WORD-BOX-QUESTION">
				<DIV ID="WORD-QUESTION">DICTIONARY</DIV>
			</DIV>
			<DIV ID="ANSWER-CONTAINER" CLASS="FLEX WORD-BOX WORD-BOX-ANSWER">
				<DIV ID="WORD-ANSWER"></DIV>
			</DIV>
		</DIV>

		<DIV CLASS="BUTTON-ZONE">
			<BUTTON TYPE="BUTTON" ID="BTN-LOAD" CLASS="BORDER BTN BTN-FULL">LOAD DICTIONARY</BUTTON>
			<INPUT TYPE="FILE" ID="INP-LOAD" ACCEPT=".TXT" CLASS="HIDDEN">
			<BUTTON TYPE="BUTTON" ID="BTN-EXEC" CLASS="BORDER BTN BTN-FULL HIDDEN">START PRACTICE</BUTTON>
			<BUTTON TYPE="BUTTON" ID="BTN-SHOW" CLASS="BORDER FLEX BTN BTN-FULL BTN-SHOW HIDDEN">
				SHOW ANSWER
				<DIV CLASS="A A-L" ARIA-HIDDEN="TRUE">↑↓</DIV>
				<DIV CLASS="A A-R" ARIA-HIDDEN="TRUE">↓↑</DIV>
			</BUTTON>
			<DIV ID="ACTION-BUTTONS" CLASS="FLEX LINE ACTION-GROUP HIDDEN">
				<BUTTON TYPE="BUTTON" ID="BTN-FAIL" CLASS="BORDER FLEX BTN BTN-FORGOT">
					FORGOT
					<DIV CLASS="A A-L" ARIA-HIDDEN="TRUE">←</DIV>
					<DIV CLASS="A A-R" ARIA-HIDDEN="TRUE">←</DIV>
				</BUTTON>
				<BUTTON TYPE="BUTTON" ID="BTN-TRUE" CLASS="BORDER FLEX BTN BTN-REMEMBER">
					REMEMBER
					<DIV CLASS="A A-L" ARIA-HIDDEN="TRUE">→</DIV>
					<DIV CLASS="A A-R" ARIA-HIDDEN="TRUE">→</DIV>
				</BUTTON>
			</DIV>
			<A ID="BTN-SAVE" DOWNLOAD="Dictionary.TXT" CLASS="BORDER BTN BTN-FULL BTN-SAVE HIDDEN">SAVE DICTIONARY</A>
		</DIV>
	</MAIN>

	<SCRIPT src="Assets/JS/Main.JS"></SCRIPT>
</BODY>

</HTML>
